<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dump</title>
<style>/* design/tokens.css, inlined so this file works on its own */
:root,[data-theme="light"]{--ground:#f2f3f7;--surface:#ffffff;--surface-soft:#ecedf4;--line:#dcdde8;--ink:#17142b;--ink-muted:#5e5d75;--ink-inverse:#ffffff;--thread-outside:#0f9d6c;--outside-ink:#0b6f4e;--outside-tint:#ddf4ea;--thread-work:#3b5bfd;--work-ink:#2b45d1;--work-tint:#e3e8ff;--thread-home:#c98300;--home-ink:#8a5b00;--home-tint:#fff0cc;--thread-anywhere:#6b6a80;--anywhere-ink:#55546a;--anywhere-tint:#ecebf3;--ask:#d6336c;--ask-ink:#a3205e;--ask-tint:#fce4ee;--danger:#b3261e;--focus:var(--thread-work);--shadow-lift:0 12px 32px rgba(23,20,43,0.14);}
[data-theme="dark"]{--ground:#0e0c1d;--surface:#181530;--surface-soft:#221e3e;--line:#2e2a4d;--ink:#f1f0fa;--ink-muted:#a9a8c3;--ink-inverse:#17142b;--thread-outside:#3dd9a0;--outside-ink:#7debc0;--outside-tint:#0f2e25;--thread-work:#8fa3ff;--work-ink:#b9c5ff;--work-tint:#1a2150;--thread-home:#ffc043;--home-ink:#ffd580;--home-tint:#33260a;--thread-anywhere:#9c9bb5;--anywhere-ink:#c8c7dc;--anywhere-tint:#262340;--ask:#ff7fb0;--ask-ink:#ffa6c8;--ask-tint:#3a1428;--danger:#ff8c85;--focus:var(--thread-work);--shadow-lift:0 12px 32px rgba(0,0,0,0.5);}
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--radius-sm:10px;--radius-md:16px;--radius-lg:24px;--radius-pill:999px;--font-sans:"Schibsted Grotesk", system-ui, sans-serif;--font-serif:"Newsreader", Georgia, serif;}
</style>
</head>
<body style="margin:0;display:flex;justify-content:center;background:#d9dbe6">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>body{margin:0}@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){[style*="wave"]{animation:none!important}}</style>
<div data-theme="light" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:24px">
<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0 20px;height:58px;box-sizing:border-box">
<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;line-height:24px;letter-spacing:-.01em"><svg width="24" height="24" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 31C5 12 23 12 23 26C23 36 11 36 11 26C11 18 24 18 30 24L43 24"/></svg>Untangle</div><button aria-label="Settings" style="width:44px;height:44px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--ink-muted);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
<div style="padding:22px 20px 0 20px"><h1 style="margin:0;font-weight:700;font-size:36px;line-height:38px;letter-spacing:-.02em">What's on your mind?</h1>
<p style="margin:10px 0 18px;color:var(--ink-muted);font-size:16px;line-height:24px">Say it or type it, in any order. I'll untangle it.</p>
<div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;height:290px;box-sizing:border-box;display:flex;flex-direction:column">
<p style="margin:0;font-size:20px;line-height:30px;flex:1">SQL assignment, gym, groceries, call Mom, send resume to Sarah, work on my app, buy toothpaste</p>
<div style="display:flex;align-items:center;justify-content:space-between"><span style="color:var(--ink-muted);font:500 13px/18px var(--font-sans)">7 things so far</span>
<button aria-label="Tap to talk" style="width:68px;height:68px;border-radius:50%;border:0;background:var(--ink);color:var(--ink-inverse);display:grid;place-items:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div></div>
<p style="margin:18px 0 8px;color:var(--ink-muted);font:500 13px/18px var(--font-sans)">Quick starts, optional</p>
<div style="display:flex;gap:8px;overflow:hidden"><button style="min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 14px/20px var(--font-sans);min-height:40px;padding:0 14px;font-weight:500">Call</button><button style="min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 14px/20px var(--font-sans);min-height:40px;padding:0 14px;font-weight:500">Buy</button><button style="min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 14px/20px var(--font-sans);min-height:40px;padding:0 14px;font-weight:500">Go to</button><button style="min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 14px/20px var(--font-sans);min-height:40px;padding:0 14px;font-weight:500">Order</button><button style="min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 14px/20px var(--font-sans);min-height:40px;padding:0 14px;font-weight:500">Email</button><button style="min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);color:var(--ink);font:600 14px/20px var(--font-sans);min-height:40px;padding:0 14px;border-style:dashed;color:var(--ink-muted)">+ Yours</button></div></div>
<div style="position:absolute;left:20px;right:20px;bottom:32px"><button style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border:0;border-radius:var(--radius-md);background:var(--ink);color:var(--ink-inverse);font:600 16px/24px var(--font-sans);">Untangle my day</button></div>
</div>
</body>
</html>
